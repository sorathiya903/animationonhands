<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loader Generator</title>

<style>
:root{
  --color:#2563eb;
  --size:60px;
  --speed:1s;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111;
}

header{
  text-align:center;
  padding:30px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:center;
  padding:20px;
}

.control{
  background:white;
  padding:12px;
  border-radius:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  padding:25px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.preview{
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Spinner */
.spinner{
  width:var(--size);
  height:var(--size);
  border:6px solid #ddd;
  border-top:6px solid var(--color);
  border-radius:50%;
  animation:spin var(--speed) linear infinite;
}

/* Dots */
.dots{
  display:flex;
  gap:8px;
}

.dots span{
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--color);
  animation:bounce var(--speed) infinite;
}

.dots span:nth-child(2){
  animation-delay:.2s;
}
.dots span:nth-child(3){
  animation-delay:.4s;
}

/* Bars */
.bars{
  display:flex;
  gap:5px;
  align-items:flex-end;
}

.bars span{
  width:10px;
  height:40px;
  background:var(--color);
  animation:bars var(--speed) infinite;
}

.bars span:nth-child(2){
  animation-delay:.15s;
}
.bars span:nth-child(3){
  animation-delay:.3s;
}
.bars span:nth-child(4){
  animation-delay:.45s;
}

/* Ring */
.ring{
  width:var(--size);
  height:var(--size);
  border:5px solid transparent;
  border-top-color:var(--color);
  border-bottom-color:var(--color);
  border-radius:50%;
  animation:spin var(--speed) linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

@keyframes bounce{
  0%,80%,100%{
    transform:scale(.4);
    opacity:.5;
  }
  40%{
    transform:scale(1);
    opacity:1;
  }
}

@keyframes bars{
  0%,100%{
    height:20px;
  }
  50%{
    height:60px;
  }
}
</style>
</head>
<body>

<header>
  <h1>🔥 Loader Generator</h1>
  <p>Customize loader color, size and speed.</p>
</header>

<div class="controls">

  <div class="control">
    <label>Color</label><br>
    <input type="color" id="color" value="#2563eb">
  </div>

  <div class="control">
    <label>Size</label><br>
    <input type="range" id="size" min="30" max="120" value="60">
  </div>

  <div class="control">
    <label>Speed</label><br>
    <input type="range" id="speed" min="0.5" max="3" step="0.1" value="1">
  </div>

</div>

<div class="gallery">

  <div class="card">
    <h3>Spinner</h3>
    <div class="preview">
      <div class="spinner"></div>
    </div>
  </div>

  <div class="card">
    <h3>Dots</h3>
    <div class="preview">
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Bars</h3>
    <div class="preview">
      <div class="bars">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Ring</h3>
    <div class="preview">
      <div class="ring"></div>
    </div>
  </div>

</div>

<script>
const root=document.documentElement;

document.getElementById('color').oninput=e=>{
  root.style.setProperty('--color',e.target.value);
};

document.getElementById('size').oninput=e=>{
  root.style.setProperty('--size',e.target.value+'px');
};

document.getElementById('speed').oninput=e=>{
  root.style.setProperty('--speed',e.target.value+'s');
};
</script>

</body>
</html>
